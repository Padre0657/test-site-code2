stages:
  - build

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination europe-west1-docker.pkg.dev/labo-quentin/apps/test-site:$CI_COMMIT_SHORT_SHA
      --destination europe-west1-docker.pkg.dev/labo-quentin/apps/test-site:latest
